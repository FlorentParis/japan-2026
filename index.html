<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Installation sur l'écran d'accueil. Le carnet se consulte sur place, dans un
      train, avec une carte SIM étrangère : installé, il démarre sans réseau (voir
      `scripts/sw-modele.js`) et sans la barre d'adresse qui mange déjà un dixième
      de l'écran d'un téléphone.

      Les icônes PNG sont produites par `npm run icones` à partir du favicon —
      Android les exige dans le manifeste, iOS dans un `apple-touch-icon`, et ni
      l'un ni l'autre ne se contente du SVG.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Japon 2026" />
    <!--
      `default`, et non `black-translucent` : le contenu ne passe pas sous la barre
      d'état. C'est un choix de prudence — l'option translucide obligerait toute la
      mise en page à réserver `env(safe-area-inset-top)`, y compris le tiroir de la
      carte et ses hauteurs calculées, pour un gain de quelques pixels. iOS insère
      donc la barre au-dessus du site, sur la couleur de fond du manifeste.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f3ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
    <title>Traversée du Japon — carnet d’itinéraire</title>
    <meta
      name="description"
      content="Carnet de voyage : itinéraire, carte des trajets, hébergements, activités et budget de la traversée du Japon, de Tokyo à Nagasaki."
    />
    <meta name="robots" content="noindex" />
    <!--
      Thème clair / sombre, posé AVANT le premier rendu pour qu'aucune page ne
      clignote au chargement. Le réglage enregistré vaut « auto » (suivre le
      système), « light » ou « dark » ; « auto » et l'absence de réglage se
      résolvent via la préférence système. La même clé de stockage
      (`voyage-japon:theme`) et la même logique sont reprises côté React, qui
      prend ensuite le relais — ici on ne fait que devancer le premier paint.
    -->
    <script>
      try {
        var brut = localStorage.getItem('voyage-japon:theme')
        var reglage = brut ? JSON.parse(brut) : 'auto'
        var sombre =
          reglage === 'dark' ||
          (reglage !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = sombre ? 'dark' : 'light'
      } catch (e) {
        /* Stockage inaccessible : on laisse le thème clair par défaut. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Ce carnet d’itinéraire a besoin de JavaScript : la carte et la frise chronologique sont
      calculées dans le navigateur.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
